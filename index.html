<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Attendance Calculator</h1>
        </header>

        <main class="calculator-section">
            <div class="calculator-container">
                <div class="calculator-form">
                    <div class="input-group">
                        <label for="attended">Classes Attended</label>
                        <input type="number" id="attended" placeholder="Enter number of classes attended" min="0">
                    </div>
                    
                    <div class="input-group">
                        <label for="total">Total Classes</label>
                        <input type="number" id="total" placeholder="Enter total number of classes" min="1">
                    </div>
                    
                    <div class="input-group">
                        <label for="target">Target Percentage</label>
                        <input type="number" id="target" placeholder="Enter target percentage" min="0" max="100" value="75">
                    </div>
                    
                    <div class="button-group">
                        <button class="btn-calculate" onclick="calculateAttendance()">Calculate</button>
                        <button class="btn-reset" onclick="resetCalculator()">Reset</button>
                    </div>
                </div>
                
                <div id="result" class="result-container" style="display: none;">
                    <div class="result-header">
                        <div class="current-percentage" id="currentPercentage"></div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    <div class="result-content">
                        <div class="status-message" id="statusMessage"></div>
                        <div class="recommendation" id="recommendation"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Contact Window -->
    <div class="contact-window" id="contactWindow">
        <div class="contact-header">
            <h3>Contact Us</h3>
            <button class="contact-close" onclick="toggleContact()">×</button>
        </div>
        <div class="contact-content">
            <form id="contactForm">
                <div class="form-group">
                    <label for="contactName">Name</label>
                    <input type="text" id="contactName" required>
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email</label>
                    <input type="email" id="contactEmail" required>
                </div>
                <div class="form-group">
                    <label for="contactMessage">Message</label>
                    <textarea id="contactMessage" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>

    <button class="contact-toggle" onclick="toggleContact()">Contact</button>

    <script src="script.js"></script>
</body>
</html>
