<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Attendance Calculator</h1>
        </header>

        <main class="calculator-section">
            <div class="calculator-container">
                <div class="calculator-form">
                    <div class="input-group">
                        <label for="attended">Classes Attended</label>
                        <input type="number" id="attended" placeholder="Enter number of classes attended" min="0">
                    </div>
                    
                    <div class="input-group">
                        <label for="total">Total Classes</label>
                        <input type="number" id="total" placeholder="Enter total number of classes" min="1">
                    </div>
                    
                    <div class="input-group">
                        <label for="target">Target Percentage</label>
                        <input type="number" id="target" placeholder="Enter target percentage" min="0" max="100" value="75">
                    </div>
                    
                    <div class="button-group">
                        <button class="btn-calculate" onclick="calculateAttendance()">Calculate</button>
                        <button class="btn-reset" onclick="resetCalculator()">Reset</button>
                    </div>
                </div>
                
                <div id="result" class="result-container" style="display: none;">
                    <div class="result-header">
                        <div class="current-percentage" id="currentPercentage"></div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    <div class="result-content">
                        <div class="status-message" id="statusMessage"></div>
                        <div class="recommendation" id="recommendation"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">Get in touch</p>
            <div class="footer-icons">
                <a href="mailto:saurabhsingh201619@gmail.com" class="footer-icon" aria-label="Email" title="Email me">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </a>
                <a href="https://github.com/saurabh-kumar-singh201" target="_blank" rel="noopener noreferrer" class="footer-icon" aria-label="GitHub" title="Visit my GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
